[theme]
base = "light"
# Tokens mirror gabes_ui/theme.py (docs/ui_redesign/decisions.md D2).
primaryColor = "#0284C7"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E1726"
borderColor = "#E3E8EF"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
linkColor = "#0369A1"
# IBM Plex (OFL-1.1, static/fonts/OFL.txt), self-hosted from static/fonts.
# Sans: latin 400-700, latin-ext and greek 400-600; Mono: latin 400-500.
# Glyphs outside these ranges (superscript digits, arrows) fall back.
font = "IBM Plex Sans, sans-serif"
headingFont = "IBM Plex Sans, sans-serif"
codeFont = "IBM Plex Mono, monospace"

[theme.sidebar]
backgroundColor = "#FBFCFD"
secondaryBackgroundColor = "#FFFFFF"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-normal.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

